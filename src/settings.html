<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Control settings</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/tab-control-128.png" width="64" height="64" alt="">
        <div>
          <h1>Tab Control settings</h1>
          <p>Set a name that identifies this browser profile.</p>
        </div>
      </header>

      <form id="settings-form">
        <label for="profile-name">Profile name</label>
        <input
          id="profile-name"
          name="profileName"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="For example, work"
          aria-describedby="name-help"
        >
        <p id="name-help" class="help">
          Use this name with <code>tabctl rpc --name &lt;name&gt;</code>.
        </p>

        <div class="instance">
          <span>Instance UUID</span>
          <code id="instance-id"></code>
        </div>

        <div class="actions">
          <span id="status" role="status" aria-live="polite"></span>
          <button type="submit">Save</button>
        </div>
      </form>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
